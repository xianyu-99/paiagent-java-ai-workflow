name: paiagent-app

services:
  backend:
    build:
      context: ./backend
    container_name: paiagent-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: 8084
      MYSQL_HOST: ${EXTERNAL_MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${EXTERNAL_MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${EXTERNAL_MYSQL_DATABASE:-paiagent}
      MYSQL_USERNAME: ${EXTERNAL_MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${EXTERNAL_MYSQL_PASSWORD:-123456}
      REDIS_HOST: ${EXTERNAL_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${EXTERNAL_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${EXTERNAL_REDIS_PASSWORD:-123456}
      MINIO_ENDPOINT: ${EXTERNAL_MINIO_ENDPOINT:-http://host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${EXTERNAL_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${EXTERNAL_MINIO_SECRET_KEY:-minioadmin}
      MINIO_PUBLIC_URL: ${EXTERNAL_MINIO_PUBLIC_URL:-http://localhost:9000}
      JWT_SECRET: ${JWT_SECRET:-paiagent_external_jwt_secret_change_me_minimum_32_chars}
      API_KEY_ENCRYPTION_SECRET: ${API_KEY_ENCRYPTION_SECRET:-paiagent_external_api_key_crypto_secret_change_me_32_chars}
      PAIAGENT_CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://172.*:*,http://10.*:*}
      APP_AUTH_DEFAULT_USERNAME: ${APP_AUTH_DEFAULT_USERNAME:-admin}
      APP_AUTH_DEFAULT_PASSWORD: ${APP_AUTH_DEFAULT_PASSWORD:-admin123}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      WORKFLOW_NODE_TIMEOUT_MS: ${WORKFLOW_NODE_TIMEOUT_MS:-120000}
      WORKFLOW_NODE_RETRY_COUNT: ${WORKFLOW_NODE_RETRY_COUNT:-0}
      WORKFLOW_MAX_NODE_RETRY_COUNT: ${WORKFLOW_MAX_NODE_RETRY_COUNT:-3}
      WORKFLOW_NODE_RETRY_BACKOFF_MS: ${WORKFLOW_NODE_RETRY_BACKOFF_MS:-500}
      WORKFLOW_NODE_EXECUTOR_POOL_SIZE: ${WORKFLOW_NODE_EXECUTOR_POOL_SIZE:-8}
      RAG_VECTOR_STORE_PROVIDER: ${RAG_VECTOR_STORE_PROVIDER:-qdrant}
      QDRANT_URL: ${EXTERNAL_QDRANT_URL:-http://host.docker.internal:6333}
      QDRANT_API_KEY: ${EXTERNAL_QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-paiagent_chunks}
      QDRANT_TIMEOUT_MS: ${QDRANT_TIMEOUT_MS:-30000}
      RAG_VECTOR_STORE_FALLBACK_TO_MYSQL: ${RAG_VECTOR_STORE_FALLBACK_TO_MYSQL:-true}
    ports:
      - "${BACKEND_PORT:-8085}:8084"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: paiagent-frontend
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend
