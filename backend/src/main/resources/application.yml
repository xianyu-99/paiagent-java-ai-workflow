server:
  port: ${SERVER_PORT:8084}

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: PaiAgent
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:60MB}
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
    livereload:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      password: ${REDIS_PASSWORD:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:paiagent}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  ai:
    openai:
      # 占位配置，实际使用时通过节点配置动态指定
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: https://api.openai.com

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.paiagent.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  info:
    title: PaiAgent API
    description: AI Agent 流图执行面板 API 文档
    version: 1.0.0

# MinIO 配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: paiagent
  publicUrl: ${MINIO_PUBLIC_URL:http://localhost:9000}
  region: ${MINIO_REGION:us-east-1}

# PaiAgent 配置
paiagent:
  security:
    # API Key 入库前使用 AES/GCM 加密；生产环境必须显式配置稳定密钥
    api-key-secret: ${API_KEY_ENCRYPTION_SECRET:}
    # 本地 Qwen/Ollama/vLLM 等私网 OpenAI-compatible 地址需要显式开启
    allow-private-network-urls: ${PAIAGENT_ALLOW_PRIVATE_NETWORK_URLS:false}
  prompt-cache:
    enabled: ${PROMPT_CACHE_ENABLED:true}
    ttl-seconds: ${PROMPT_CACHE_TTL_SECONDS:3600}
    max-entries: ${PROMPT_CACHE_MAX_ENTRIES:2048}
    minimum-chars: ${PROMPT_CACHE_MINIMUM_CHARS:256}
  auth:
    # 本地开发未配置 JWT_SECRET 时会自动生成临时强密钥；生产环境请务必显式配置
    jwt-secret: ${JWT_SECRET:}
    access-token-expiration-minutes: 120
    refresh-token-expiration-hours: 168
  # 默认管理员账户（生产环境必须修改或禁用）
  # 通过环境变量 APP_AUTH_DEFAULT_USERNAME 和 APP_AUTH_DEFAULT_PASSWORD 配置
  # 留空则禁用默认账户，必须通过注册功能创建账户
  default-username: ${APP_AUTH_DEFAULT_USERNAME:admin}
  default-password: ${APP_AUTH_DEFAULT_PASSWORD:admin123}
  execution:
    node-timeout-ms: ${WORKFLOW_NODE_TIMEOUT_MS:120000}
    node-retry-count: ${WORKFLOW_NODE_RETRY_COUNT:0}
    max-node-retry-count: ${WORKFLOW_MAX_NODE_RETRY_COUNT:3}
    node-retry-backoff-ms: ${WORKFLOW_NODE_RETRY_BACKOFF_MS:500}
    node-executor-pool-size: ${WORKFLOW_NODE_EXECUTOR_POOL_SIZE:8}
    workflow-executor-core-size: ${WORKFLOW_EXECUTOR_CORE_SIZE:4}
    workflow-executor-max-size: ${WORKFLOW_EXECUTOR_MAX_SIZE:8}
    workflow-executor-queue-capacity: ${WORKFLOW_EXECUTOR_QUEUE_CAPACITY:100}
    tts-executor-pool-size: ${TTS_EXECUTOR_POOL_SIZE:4}
    tts-executor-queue-capacity: ${TTS_EXECUTOR_QUEUE_CAPACITY:100}
  rag:
    retrieval:
      tokenizer:
        stop-words: ${RAG_TOKENIZER_STOP_WORDS:的,了,在,是,我,有,和,就,不,人,都,一,一个,上,也,很,到,说,要,去,你,会,着,没有,看,好,自己,这}
        max-search-terms: ${RAG_TOKENIZER_MAX_SEARCH_TERMS:16}
      bm25:
        k1: ${RAG_BM25_K1:1.2}
        b: ${RAG_BM25_B:0.75}
    rerank:
      enabled: ${RAG_RERANK_ENABLED:true}
      external-enabled: ${RAG_RERANK_EXTERNAL_ENABLED:true}
      local-enabled: ${RAG_RERANK_LOCAL_ENABLED:false}
      local-base-url: ${RAG_RERANK_LOCAL_BASE_URL:http://localhost:8001/rerank}
      model: ${RAG_RERANK_MODEL:gte-rerank-v2}
      base-url: ${RAG_RERANK_BASE_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
      timeout-ms: ${RAG_RERANK_TIMEOUT_MS:2000}
      max-retries: ${RAG_RERANK_MAX_RETRIES:1}
      llm-fallback-enabled: ${RAG_RERANK_LLM_FALLBACK_ENABLED:false}
      candidate-limit: ${RAG_RERANK_CANDIDATE_LIMIT:12}
      high-confidence-skip-enabled: ${RAG_RERANK_HIGH_CONFIDENCE_SKIP_ENABLED:true}
      high-confidence-min-vector-score: ${RAG_RERANK_HIGH_CONFIDENCE_MIN_VECTOR_SCORE:0.72}
      high-confidence-min-keyword-score: ${RAG_RERANK_HIGH_CONFIDENCE_MIN_KEYWORD_SCORE:0.08}
      high-confidence-min-rrf-margin: ${RAG_RERANK_HIGH_CONFIDENCE_MIN_RRF_MARGIN:0.0}
      cache-enabled: ${RAG_RERANK_CACHE_ENABLED:true}
      cache-ttl-seconds: ${RAG_RERANK_CACHE_TTL_SECONDS:300}
      cache-max-size: ${RAG_RERANK_CACHE_MAX_SIZE:2048}
    graph:
      backfill-enabled: ${RAG_GRAPH_BACKFILL_ENABLED:true}
    embedding:
      provider: ${RAG_EMBEDDING_PROVIDER:dashscope}
      base-url: ${RAG_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${RAG_EMBEDDING_API_KEY:${Qwen_API_KEY:${QWEN_API_KEY:${DASHSCOPE_API_KEY:${API_KEY:}}}}}
      model: ${RAG_EMBEDDING_MODEL:text-embedding-v4}
      dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
      timeout-ms: ${RAG_EMBEDDING_TIMEOUT_MS:30000}
      batch-size: ${RAG_EMBEDDING_BATCH_SIZE:16}
      request-batching-enabled: ${RAG_EMBEDDING_REQUEST_BATCHING_ENABLED:true}
      request-batch-window-ms: ${RAG_EMBEDDING_REQUEST_BATCH_WINDOW_MS:20}
      cache-enabled: ${RAG_EMBEDDING_CACHE_ENABLED:true}
      cache-ttl-seconds: ${RAG_EMBEDDING_CACHE_TTL_SECONDS:3600}
      cache-max-size: ${RAG_EMBEDDING_CACHE_MAX_SIZE:2048}
      max-concurrent-requests: ${RAG_EMBEDDING_MAX_CONCURRENT_REQUESTS:4}
      rate-limit-permits-per-second: ${RAG_EMBEDDING_RATE_LIMIT_PERMITS_PER_SECOND:4}
      retry-max-attempts: ${RAG_EMBEDDING_RETRY_MAX_ATTEMPTS:3}
      retry-initial-backoff-ms: ${RAG_EMBEDDING_RETRY_INITIAL_BACKOFF_MS:300}
      retry-max-backoff-ms: ${RAG_EMBEDDING_RETRY_MAX_BACKOFF_MS:2000}
    vector-store:
      qdrant-url: ${QDRANT_URL:http://localhost:6333}
      qdrant-api-key: ${QDRANT_API_KEY:}
      collection-prefix: ${QDRANT_COLLECTION_PREFIX:paiagent_chunks}
      timeout-ms: ${QDRANT_TIMEOUT_MS:30000}
  skills:
    path: skills
